<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニメ情報 Notion 登録ツール (Wikipedia 照会)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      color: #333;
      background-color: #f7f7f5;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .search-box input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #0b6bcb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #185ea5; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 2カラム表示 */
    .compare-container {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    @media (max-width: 900px) {
      .compare-container {
        grid-template-columns: 1fr;
      }
    }

    /* 左カラム：Wikipediaそのままの表 */
    .wiki-view-panel {
      border-right: 1px solid #eee;
      padding-right: 20px;
      max-height: 800px;
      overflow-y: auto;
    }
    @media (max-width: 900px) {
      .wiki-view-panel {
        border-right: none;
        border-bottom: 1px solid #eee;
        padding-right: 0;
        padding-bottom: 20px;
      }
    }
    .wiki-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .wiki-header h3 { margin: 0; font-size: 1.1rem; }
    .wiki-link {
      font-size: 0.85rem;
      color: #0b6bcb;
      text-decoration: none;
    }
    .wiki-link:hover { text-decoration: underline; }

    /* 移植されたWikipedia表のスタイル補正 */
    .wiki-table-wrapper table {
      width: 100% !important;
      font-size: 0.82rem !important;
      border-collapse: collapse !important;
      border: 1px solid #ccc !important;
      background-color: #f9f9f9 !important;
      line-height: 1.4 !important;
    }
    .wiki-table-wrapper th, .wiki-table-wrapper td {
      border: 1px solid #ddd !important;
      padding: 5px 8px !important;
    }
    .wiki-table-wrapper th {
      background-color: #eaecf0 !important;
      text-align: left !important;
      width: 32% !important;
    }

    /* 右カラム：入力フォーム */
    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      column-gap: 12px;
      align-items: center;
      font-size: 0.9rem;
    }
    .form-label {
      color: #666;
      font-weight: bold;
    }
    .form-row input[type="text"] {
      padding: 8px 10px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    /* タグ一覧・追加共通スタイル */
    .tag-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
    }
    .tag-item {
      display: inline-flex;
      align-items: center;
      background-color: #e3effb;
      color: #0b6bcb;
      border: 1px solid #bcd7f5;
      padding: 3px 8px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .tag-close {
      margin-left: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #7b9ebc;
      font-size: 14px;
    }
    .tag-close:hover { color: #c92a2a; }

    /* クール選択UI */
    .season-picker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .season-picker select {
      padding: 6px 10px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
    }
    .season-btn-group {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }
    .season-btn {
      padding: 6px 10px;
      font-size: 0.85rem;
      background-color: #fff;
      color: #333;
      border: none;
      border-right: 1px solid #ccc;
      border-radius: 0;
      cursor: pointer;
    }
    .season-btn:last-child { border-right: none; }
    .season-btn:hover { background-color: #eee; }
    .season-btn.active {
      background-color: #0b6bcb;
      color: #fff;
    }
    .add-btn-small {
      padding: 6px 12px;
      font-size: 0.85rem;
      background-color: #555;
    }
    .add-btn-small:hover { background-color: #333; }

    /* ジャンル追加UI */
    .genre-add-box {
      display: flex;
      gap: 6px;
      max-width: 300px;
    }

    .action-panel {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select.status-select {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .status-msg {
      font-weight: bold;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h1>アニメ情報 Notion 登録 (Wikipedia照会ツール)</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="作品名を入力（例: けいおん！、ぼっち・ざ・ろっく！）" onkeydown="if(event.key==='Enter') search();">
    <button onclick="search()" id="searchBtn">検索</button>
  </div>

  <div id="results"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUHgNqoOqw3vGTDbTVfiQUq6Ot_kZu6pc0IOAAQ0R6YDmmBCK7FxgYynrCspRWTxF6dw/exec";

    let currentResults = [];
    let stateSeasons = [];
    let stateGenres = [];
    let selectedSeasonQuarter = ""; // "冬", "春", "夏", "秋" または ""

    async function search() {
      const keyword = document.getElementById("keyword").value.trim();
      if (!keyword) return;

      const resultsDiv = document.getElementById("results");
      const searchBtn = document.getElementById("searchBtn");
      resultsDiv.innerHTML = "<p>Wikipediaから情報を取得中...</p>";
      searchBtn.disabled = true;

      try {
        const targetUrl = `${GAS_URL}?action=search&keyword=${encodeURIComponent(keyword)}`;
        const response = await fetch(targetUrl);
        const res = await response.json();

        searchBtn.disabled = false;

        if (res.status !== "success" || !res.data || res.data.length === 0) {
          resultsDiv.innerHTML = "<p>Wikipedia上に該当記事が見つかりませんでした。</p>";
          return;
        }

        currentResults = res.data;
        renderMainView();
      } catch (err) {
        searchBtn.disabled = false;
        resultsDiv.innerHTML = `<p style="color:red;">通信エラーが発生しました: ${err.message}</p>`;
      }
    }

    function renderMainView() {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      const item = currentResults[0];
      const initial = item.initial || {};

      stateGenres = initial.genres || [];
      stateSeasons = []; // 初期は空（プルダウンからポチポチ追加）

      // 西暦（2000〜2050）のオプション生成
      let yearOptions = "";
      for (let y = 2000; y <= 2050; y++) {
        const isSelected = (y === 2009) ? "selected" : "";
        yearOptions += `<option value="${y}" ${isSelected}>${y}年</option>`;
      }

      const joinStr = (arr) => (arr || []).join(", ");

      const container = document.createElement("div");
      container.className = "compare-container";

      container.innerHTML = `
        <!-- 左：Wikipediaの表そのものを移植 -->
        <div class="wiki-view-panel">
          <div class="wiki-header">
            <h3>Wikipedia情報</h3>
            <a href="${item.wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-link">Wikiを開く ↗</a>
          </div>
          <div class="wiki-table-wrapper">
            ${item.tableHtml}
          </div>
        </div>

        <!-- 右：Notion登録フォーム -->
        <div class="form-panel">
          <div class="form-row">
            <div class="form-label">作品名:</div>
            <div><input type="text" id="reg-title" value="${item.title} (第1期)"></div>
          </div>

          <div class="form-row">
            <div class="form-label">放送クール:</div>
            <div class="tag-container">
              <div class="tag-list" id="season-tag-list"></div>
              
              <!-- クール選択ピッカー（年 ＋ 春夏秋冬 ＋ 追加） -->
              <div class="season-picker">
                <select id="season-year-select">
                  ${yearOptions}
                </select>
                <div class="season-btn-group">
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '冬')">冬</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '春')">春</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '夏')">夏</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '秋')">秋</button>
                </div>
                <button type="button" class="add-btn-small" onclick="addSeasonTag()">クール追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">ジャンル:</div>
            <div class="tag-container">
              <div class="tag-list" id="genre-tag-list"></div>
              <div class="genre-add-box">
                <input type="text" id="new-genre-input" placeholder="ジャンルを追加..." onkeydown="if(event.key==='Enter'){event.preventDefault(); addGenreTag();}">
                <button type="button" class="add-btn-small" onclick="addGenreTag()">追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">制作会社:</div>
            <div><input type="text" id="reg-studios" value="${joinStr(initial.studios)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">原作者:</div>
            <div><input type="text" id="reg-authors" value="${joinStr(initial.authors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">監督:</div>
            <div><input type="text" id="reg-directors" value="${joinStr(initial.directors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">キャラデザ:</div>
            <div><input type="text" id="reg-charaDesigns" value="${joinStr(initial.charaDesigns)}"></div>
          </div>

          <div class="form-row">
            <div
