<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニメ情報 Notion 登録ツール (Wikipedia照会)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 20px;
      color: #333;
      background-color: #f7f7f5;
    }
    h1 {
      font-size: 1.35rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-box input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 22px;
      font-size: 1rem;
      background-color: #0b6bcb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #185ea5; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    .compare-layout {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 950px) {
      .compare-layout { grid-template-columns: 1fr; }
    }

    .wiki-sticky-panel {
      position: sticky;
      top: 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .wiki-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .wiki-header h3 { margin: 0; font-size: 1rem; }
    .wiki-link { font-size: 0.85rem; color: #0b6bcb; text-decoration: none; }
    .wiki-link:hover { text-decoration: underline; }
    
    .wiki-iframe-wrapper {
      height: 700px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background-color: #fafafa;
    }
    .wiki-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .forms-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .season-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title-header {
      font-size: 1.15rem;
      font-weight: bold;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 4px;
      color: #111;
    }

    .form-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      column-gap: 12px;
      align-items: center;
      font-size: 0.9rem;
    }
    .form-label { color: #666; font-weight: bold; }
    .form-row input[type="text"] {
      padding: 8px 10px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    /* タイトル入力エリア用（入力欄＋第1期付与ボタン） */
    .title-input-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toggle-season1-btn {
      padding: 8px 12px;
      font-size: 0.85rem;
      background-color: #f0f4f8;
      color: #0b6bcb;
      border: 1px solid #bcd7f5;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .toggle-season1-btn:hover {
      background-color: #dceaf7;
    }
    .toggle-season1-btn.active {
      background-color: #0b6bcb;
      color: #fff;
      border-color: #0b6bcb;
    }

    .tag-container { display: flex; flex-direction: column; gap: 6px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
    .tag-item {
      display: inline-flex;
      align-items: center;
      background-color: #e3effb;
      color: #0b6bcb;
      border: 1px solid #bcd7f5;
      padding: 3px 8px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .tag-close { margin-left: 6px; cursor: pointer; font-weight: bold; color: #7b9ebc; font-size: 14px; }
    .tag-close:hover { color: #c92a2a; }

    .season-picker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background-color: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .season-picker select {
      padding: 6px 8px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
    }
    .season-btn-group {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }
    .season-btn {
      padding: 6px 10px;
      font-size: 0.85rem;
      background-color: #fff;
      color: #333;
      border: none;
      border-right: 1px solid #ccc;
      border-radius: 0;
      cursor: pointer;
    }
    .season-btn:last-child { border-right: none; }
    .season-btn:hover { background-color: #f0f0f0; }
    .season-btn.active { background-color: #0b6bcb; color: #fff; }
    .add-btn-small { padding: 6px 12px; font-size: 0.85rem; background-color: #555; }
    .add-btn-small:hover { background-color: #333; }

    .genre-add-box { display: flex; gap: 6px; max-width: 320px; }

    .action-panel {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select.status-select {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .status-msg { font-weight: bold; font-size: 0.95rem; }
    .loading-notice { font-size: 1rem; color: #555; padding: 20px 0; }
  </style>
</head>
<body>

  <h1>アニメ情報 Notion 登録 (Wikipedia照会ツール)</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="作品名を入力（例: けいおん！、ぼっち・ざ・ろっく！）" onkeydown="if(event.key==='Enter') search();">
    <button onclick="search()" id="searchBtn">検索</button>
  </div>

  <div id="results"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUHgNqoOqw3vGTDbTVfiQUq6Ot_kZu6pc0IOAAQ0R6YDmmBCK7FxgYynrCspRWTxF6dw/exec";

    let currentResults = [];
    let cardStates = [];

    async function search() {
      const keyword = document.getElementById("keyword").value.trim();
      if (!keyword) return;

      const resultsDiv = document.getElementById("results");
      const searchBtn = document.getElementById("searchBtn");
      resultsDiv.innerHTML = "<p class='loading-notice'>🔍 Wikipediaから情報を照会中...</p>";
      searchBtn.disabled = true;

      try {
        const targetUrl = `${GAS_URL}?action=search&keyword=${encodeURIComponent(keyword)}`;
        const response = await fetch(targetUrl);
        const res = await response.json();

        searchBtn.disabled = false;

        if (res.status !== "success" || !res.data || res.data.length === 0) {
          resultsDiv.innerHTML = "<p>Wikipedia上に該当記事が見つかりませんでした。</p>";
          return;
        }

        currentResults = res.data;
        renderLayout();
      } catch (err) {
        searchBtn.disabled = false;
        resultsDiv.innerHTML = `<p style="color:red;">通信エラーが発生しました: ${err.message}</p>`;
      }
    }

    function renderLayout() {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      const firstItem = currentResults[0];

      cardStates = currentResults.map(item => ({
        seasons: [],
        genres: [...(item.genres || [])],
        selectedQuarter: "",
        hasSeason1Tag: false
      }));

      let yearOptions = "";
      for (let y = 2000; y <= 2050; y++) {
        const isSelected = (y === 2009) ? "selected" : "";
        yearOptions += `<option value="${y}" ${isSelected}>${y}年</option>`;
      }

      const joinStr = (arr) => (arr || []).join(", ");

      const layout = document.createElement("div");
      layout.className = "compare-layout";

      const leftPanel = document.createElement("div");
      leftPanel.className = "wiki-sticky-panel";
      leftPanel.innerHTML = `
        <div class="wiki-header">
          <h3>Wikipedia 参照</h3>
          <a href="${firstItem.wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-link">ブラウザで開く ↗</a>
        </div>
        <div class="wiki-iframe-wrapper">
          <iframe src="${firstItem.mobileUrl}" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
        </div>
      `;
      layout.appendChild(leftPanel);

      const rightColumn = document.createElement("div");
      rightColumn.className = "forms-column";

      currentResults.forEach((work, idx) => {
        const card = document.createElement("div");
        card.className = "season-card";

        // 第1期の場合のみ「+ (第1期) を追加」ボタンを表示
        const isSeason1 = (work.seasonNum === 1 || !work.seasonNum);
        const season1BtnHtml = isSeason1
          ? `<button type="button" class="toggle-season1-btn" id="s1-btn-${idx}" onclick="toggleSeason1Title(${idx})">+ (第1期) を追加</button>`
          : "";

        card.innerHTML = `
          <div class="card-title-header">${work.title}</div>

          <div class="form-row">
            <div class="form-label">作品名:</div>
            <div class="title-input-box">
              <input type="text" id="reg-title-${idx}" value="${work.title}">
              ${season1BtnHtml}
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">放送クール:</div>
            <div class="tag-container">
              <div class="tag-list" id="season-tag-list-${idx}"></div>
              
              <div class="season-picker">
                <select id="season-year-select-${idx}">
                  ${yearOptions}
                </select>
                <div class="season-btn-group">
                  <button type="button" class="season-btn" onclick="toggleQuarter(${idx}, this, '冬')">冬</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(${idx}, this, '春')">春</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(${idx}, this, '夏')">夏</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(${idx}, this, '秋')">秋</button>
                </div>
                <button type="button" class="add-btn-small" onclick="addSeasonTag(${idx})">クール追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">ジャンル:</div>
            <div class="tag-container">
              <div class="tag-list" id="genre-tag-list-${idx}"></div>
              <div class="genre-add-box">
                <input type="text" id="new-genre-input-${idx}" placeholder="ジャンルを追加..." onkeydown="if(event.key==='Enter'){event.preventDefault(); addGenreTag(${idx});}">
                <button type="button" class="add-btn-small" onclick="addGenreTag(${idx})">追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">制作会社:</div>
            <div><input type="text" id="reg-studios-${idx}" value="${joinStr(work.studios)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">原作者:</div>
            <div><input type="text" id="reg-authors-${idx}" value="${joinStr(work.authors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">監督:</div>
            <div><input type="text" id="reg-directors-${idx}" value="${joinStr(work.directors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">キャラデザ:</div>
            <div><input type="text" id="reg-charaDesigns-${idx}" value="${joinStr(work.charaDesigns)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">音楽:</div>
            <div><input type="text" id="reg-musics-${idx}" value="${joinStr(work.musics)}"></div>
          </div>

          <div class="action-panel">
            <select id="reg-status-${idx}" class="status-select">
              <option value="未視聴">未視聴</option>
              <option value="視聴中">視聴中</option>
              <option value="視聴済" selected>視聴済</option>
              <option value="視聴完了">視聴完了</option>
              <option value="中断">中断</option>
            </select>
            <button id="registerBtn-${idx}" onclick="executeRegister(${idx})">この内容でNotionに登録</button>
            <span id="statusMsg-${idx}" class="status-msg"></span>
          </div>
        `;

        rightColumn.appendChild(card);
      });

      layout.appendChild(rightColumn);
      resultsDiv.appendChild(layout);

      currentResults.forEach((_, idx) => {
        renderSeasonTags(idx);
        renderGenreTags(idx);
      });
    }

    // 「(第1期)」の付け外しトグル処理
    function toggleSeason1Title(idx) {
      const input = document.getElementById(`reg-title-${idx}`);
      const btn = document.getElementById(`s1-btn-${idx}`);
      let val = input.value.trim();

      if (val.includes("(第1期)")) {
        val = val.replace(/\s*\(第1期\)/g, "").trim();
        btn.textContent = "+ (第1期) を追加";
        btn.classList.remove("active");
      } else {
        val = `${val} (第1期)`;
        btn.textContent = "- (第1期) を解除";
        btn.classList.add("active");
      }
      input.value = val;
    }

    function toggleQuarter(cardIdx, btn, qName) {
      const state = cardStates[cardIdx];
      const cardEl = btn.closest(".season-card");
      if (state.selectedQuarter === qName) {
        state.selectedQuarter = "";
        btn.classList.remove("active");
      } else {
        state.selectedQuarter = qName;
        cardEl.querySelectorAll(".season-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }
    }

    function addSeasonTag(cardIdx) {
      const state = cardStates[cardIdx];
      const year = document.getElementById(`season-year-select-${cardIdx}`).value;
      const tag = state.selectedQuarter ? `${year} ${state.selectedQuarter}` : `${year}`;

      if (!state.seasons.includes(tag)) {
        state.seasons.push(tag);
        renderSeasonTags(cardIdx);
      }
    }

    function removeSeasonTag(cardIdx, tagIdx) {
      cardStates[cardIdx].seasons.splice(tagIdx, 1);
      renderSeasonTags(cardIdx);
    }

    function renderSeasonTags(cardIdx) {
      const list = document.getElementById(`season-tag-list-${cardIdx}`);
      list.innerHTML = "";
      cardStates[cardIdx].seasons.forEach((tag, tIdx) => {
        const item = document.createElement("span");
        item.className = "tag-item";
        item.innerHTML = `${tag} <span class="tag-close" onclick="removeSeasonTag(${cardIdx}, ${tIdx})">&times;</span>`;
        list.appendChild(item);
      });
    }

    function addGenreTag(cardIdx) {
      const state = cardStates[cardIdx];
      const input = document.getElementById(`new-genre-input-${cardIdx}`);
      const val = input.value.trim();
      if (!val) return;
      if (!state.genres.includes(val)) {
        state.genres.push(val);
        renderGenreTags(cardIdx);
      }
      input.value = "";
    }

    function removeGenreTag(cardIdx, tagIdx) {
      cardStates[cardIdx].genres.splice(tagIdx, 1);
      renderGenreTags(cardIdx);
    }

    function renderGenreTags(cardIdx) {
      const list = document.getElementById(`genre-tag-list-${cardIdx}`);
      list.innerHTML = "";
      cardStates[cardIdx].genres.forEach((tag, tIdx) => {
        const item = document.createElement("span");
        item.className = "tag-item";
        item.innerHTML = `${tag} <span class="tag-close" onclick="removeGenreTag(${cardIdx}, ${tIdx})">&times;</span>`;
        list.appendChild(item);
      });
    }

    async function executeRegister(cardIdx) {
      const btn = document.getElementById(`registerBtn-${cardIdx}`);
      const msg = document.getElementById(`statusMsg-${cardIdx}`);
      const state = cardStates[cardIdx];

      const splitCsv = (id) => document.getElementById(id).value.split(/[,、]/).map(s => s.trim()).filter(Boolean);

      const title = document.getElementById(`reg-title-${cardIdx}`).value.trim();
      const studios = splitCsv(`reg-studios-${cardIdx}`);
      const authors = splitCsv(`reg-authors-${cardIdx}`);
      const directors = splitCsv(`reg-directors-${cardIdx}`);
      const charaDesigns = splitCsv(`reg-charaDesigns-${cardIdx}`);
      const musics = splitCsv(`reg-musics-${cardIdx}`);
      const status = document.getElementById(`reg-status-${cardIdx}`).value;

      btn.disabled = true;
      msg.textContent = "Notionへ登録中...";
      msg.style.color = "#0b6bcb";

      try {
        const payload = {
          action: "register",
          workData: {
            title: title,
            status: status,
            seasons: state.seasons,
            genres: state.genres,
            studios: studios,
            authors: authors,
            directors: directors,
            charaDesigns: charaDesigns,
            musics: musics
          }
        };

        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === "success") {
          msg.textContent = "✔ Notionに登録完了しました！";
          msg.style.color = "#0a7c42";
        } else {
          msg.textContent = `❌ エラー: ${res.message}`;
          msg.style.color = "red";
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = `❌ 通信エラー: ${err.message}`;
        msg.style.color = "red";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
