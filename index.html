<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニメ情報 Notion 登録ツール (Wikipedia照会)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 1250px;
      margin: 25px auto;
      padding: 0 20px;
      color: #333;
      background-color: #f7f7f5;
    }
    h1 {
      font-size: 1.4rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-box input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 22px;
      font-size: 1rem;
      background-color: #0b6bcb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #185ea5; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 左右2分割レイアウト */
    .compare-container {
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    @media (max-width: 950px) {
      .compare-container { grid-template-columns: 1fr; }
    }

    /* 左カラム：Wikipediaの埋め込み */
    .wiki-view-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #eee;
      padding-right: 20px;
    }
    @media (max-width: 950px) {
      .wiki-view-panel { border-right: none; border-bottom: 1px solid #eee; padding-right: 0; padding-bottom: 20px; }
    }
    .wiki-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .wiki-header h3 { margin: 0; font-size: 1.05rem; }
    .wiki-link { font-size: 0.85rem; color: #0b6bcb; text-decoration: none; }
    .wiki-link:hover { text-decoration: underline; }
    
    .wiki-iframe-wrapper {
      flex: 1;
      height: 680px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background-color: #fafafa;
    }
    .wiki-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 右カラム：入力フォーム */
    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      column-gap: 12px;
      align-items: center;
      font-size: 0.9rem;
    }
    .form-label { color: #666; font-weight: bold; }
    .form-row input[type="text"] {
      padding: 8px 10px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .tag-container { display: flex; flex-direction: column; gap: 6px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
    .tag-item {
      display: inline-flex;
      align-items: center;
      background-color: #e3effb;
      color: #0b6bcb;
      border: 1px solid #bcd7f5;
      padding: 3px 8px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .tag-close { margin-left: 6px; cursor: pointer; font-weight: bold; color: #7b9ebc; font-size: 14px; }
    .tag-close:hover { color: #c92a2a; }

    /* クール選択UI */
    .season-picker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background-color: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .season-picker select {
      padding: 6px 8px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
    }
    .season-btn-group {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }
    .season-btn {
      padding: 6px 10px;
      font-size: 0.85rem;
      background-color: #fff;
      color: #333;
      border: none;
      border-right: 1px solid #ccc;
      border-radius: 0;
      cursor: pointer;
    }
    .season-btn:last-child { border-right: none; }
    .season-btn:hover { background-color: #f0f0f0; }
    .season-btn.active { background-color: #0b6bcb; color: #fff; }
    .add-btn-small { padding: 6px 12px; font-size: 0.85rem; background-color: #555; }
    .add-btn-small:hover { background-color: #333; }

    .genre-add-box { display: flex; gap: 6px; max-width: 320px; }

    .action-panel {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select.status-select {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .status-msg { font-weight: bold; font-size: 0.95rem; }
    .loading-notice { font-size: 1rem; color: #555; padding: 20px 0; }
  </style>
</head>
<body>

  <h1>アニメ情報 Notion 登録 (Wikipedia照会ツール)</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="作品名を入力（例: けいおん！、ぼっち・ざ・ろっく！）" onkeydown="if(event.key==='Enter') search();">
    <button onclick="search()" id="searchBtn">検索</button>
  </div>

  <div id="results"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwUHgNqoOqw3vGTDbTVfiQUq6Ot_kZu6pc0IOAAQ0R6YDmmBCK7FxgYynrCspRWTxF6dw/exec";

    let currentResults = [];
    let stateSeasons = [];
    let stateGenres = [];
    let selectedSeasonQuarter = "";

    async function search() {
      const keyword = document.getElementById("keyword").value.trim();
      if (!keyword) return;

      const resultsDiv = document.getElementById("results");
      const searchBtn = document.getElementById("searchBtn");
      resultsDiv.innerHTML = "<p class='loading-notice'>🔍 Wikipediaから情報を照会中...</p>";
      searchBtn.disabled = true;

      try {
        const targetUrl = `${GAS_URL}?action=search&keyword=${encodeURIComponent(keyword)}`;
        const response = await fetch(targetUrl);
        const res = await response.json();

        searchBtn.disabled = false;

        if (res.status !== "success" || !res.data || res.data.length === 0) {
          resultsDiv.innerHTML = "<p>Wikipedia上に該当記事が見つかりませんでした。</p>";
          return;
        }

        currentResults = res.data;
        renderMainView();
      } catch (err) {
        searchBtn.disabled = false;
        resultsDiv.innerHTML = `<p style="color:red;">通信エラーが発生しました: ${err.message}</p>`;
      }
    }

    function renderMainView() {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      const item = currentResults[0];
      const initial = item.initial || {};

      stateGenres = initial.genres || [];
      stateSeasons = [];

      let yearOptions = "";
      for (let y = 2000; y <= 2050; y++) {
        const isSelected = (y === 2009) ? "selected" : "";
        yearOptions += `<option value="${y}" ${isSelected}>${y}年</option>`;
      }

      const joinStr = (arr) => (arr || []).join(", ");

      const container = document.createElement("div");
      container.className = "compare-container";

      container.innerHTML = `
        <!-- 左：Wikipediaの埋め込み（インフォボックスが即座に確認可能） -->
        <div class="wiki-view-panel">
          <div class="wiki-header">
            <h3>Wikipedia 参照</h3>
            <a href="${item.wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-link">ブラウザで開く ↗</a>
          </div>
          <div class="wiki-iframe-wrapper">
            <iframe src="${item.mobileUrl}" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
          </div>
        </div>

        <!-- 右：Notion登録フォーム -->
        <div class="form-panel">
          <div class="form-row">
            <div class="form-label">作品名:</div>
            <div><input type="text" id="reg-title" value="${item.title} (第1期)"></div>
          </div>

          <div class="form-row">
            <div class="form-label">放送クール:</div>
            <div class="tag-container">
              <div class="tag-list" id="season-tag-list"></div>
              
              <div class="season-picker">
                <select id="season-year-select">
                  ${yearOptions}
                </select>
                <div class="season-btn-group">
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '冬')">冬</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '春')">春</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '夏')">夏</button>
                  <button type="button" class="season-btn" onclick="toggleQuarter(this, '秋')">秋</button>
                </div>
                <button type="button" class="add-btn-small" onclick="addSeasonTag()">クール追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">ジャンル:</div>
            <div class="tag-container">
              <div class="tag-list" id="genre-tag-list"></div>
              <div class="genre-add-box">
                <input type="text" id="new-genre-input" placeholder="ジャンルを追加..." onkeydown="if(event.key==='Enter'){event.preventDefault(); addGenreTag();}">
                <button type="button" class="add-btn-small" onclick="addGenreTag()">追加</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-label">制作会社:</div>
            <div><input type="text" id="reg-studios" value="${joinStr(initial.studios)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">原作者:</div>
            <div><input type="text" id="reg-authors" value="${joinStr(initial.authors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">監督:</div>
            <div><input type="text" id="reg-directors" value="${joinStr(initial.directors)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">キャラデザ:</div>
            <div><input type="text" id="reg-charaDesigns" value="${joinStr(initial.charaDesigns)}"></div>
          </div>

          <div class="form-row">
            <div class="form-label">音楽:</div>
            <div><input type="text" id="reg-musics" value="${joinStr(initial.musics)}"></div>
          </div>

          <div class="action-panel">
            <select id="reg-status" class="status-select">
              <option value="未視聴">未視聴</option>
              <option value="視聴中">視聴中</option>
              <option value="視聴済" selected>視聴済</option>
              <option value="視聴完了">視聴完了</option>
              <option value="中断">中断</option>
            </select>
            <button id="registerBtn" onclick="executeRegister()">この内容でNotionに登録</button>
            <span id="statusMsg" class="status-msg"></span>
          </div>
        </div>
      `;

      resultsDiv.appendChild(container);
      renderSeasonTags();
      renderGenreTags();
    }

    function toggleQuarter(btn, qName) {
      if (selectedSeasonQuarter === qName) {
        selectedSeasonQuarter = "";
        btn.classList.remove("active");
      } else {
        selectedSeasonQuarter = qName;
        document.querySelectorAll(".season-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }
    }

    function addSeasonTag() {
      const year = document.getElementById("season-year-select").value;
      const tag = selectedSeasonQuarter ? `${year} ${selectedSeasonQuarter}` : `${year}`;

      if (!stateSeasons.includes(tag)) {
        stateSeasons.push(tag);
        renderSeasonTags();
      }
    }

    function removeSeasonTag(idx) {
      stateSeasons.splice(idx, 1);
      renderSeasonTags();
    }

    function renderSeasonTags() {
      const list = document.getElementById("season-tag-list");
      list.innerHTML = "";
      stateSeasons.forEach((tag, idx) => {
        const item = document.createElement("span");
        item.className = "tag-item";
        item.innerHTML = `${tag} <span class="tag-close" onclick="removeSeasonTag(${idx})">&times;</span>`;
        list.appendChild(item);
      });
    }

    function addGenreTag() {
      const input = document.getElementById("new-genre-input");
      const val = input.value.trim();
      if (!val) return;
      if (!stateGenres.includes(val)) {
        stateGenres.push(val);
        renderGenreTags();
      }
      input.value = "";
    }

    function removeGenreTag(idx) {
      stateGenres.splice(idx, 1);
      renderGenreTags();
    }

    function renderGenreTags() {
      const list = document.getElementById("genre-tag-list");
      list.innerHTML = "";
      stateGenres.forEach((tag, idx) => {
        const item = document.createElement("span");
        item.className = "tag-item";
        item.innerHTML = `${tag} <span class="tag-close" onclick="removeGenreTag(${idx})">&times;</span>`;
        list.appendChild(item);
      });
    }

    async function executeRegister() {
      const btn = document.getElementById("registerBtn");
      const msg = document.getElementById("statusMsg");

      const splitCsv = (id) => document.getElementById(id).value.split(/[,、]/).map(s => s.trim()).filter(Boolean);

      const title = document.getElementById("reg-title").value.trim();
      const studios = splitCsv("reg-studios");
      const authors = splitCsv("reg-authors");
      const directors = splitCsv("reg-directors");
      const charaDesigns = splitCsv("reg-charaDesigns");
      const musics = splitCsv("reg-musics");
      const status = document.getElementById("reg-status").value;

      btn.disabled = true;
      msg.textContent = "Notionへ登録中...";
      msg.style.color = "#0b6bcb";

      try {
        const payload = {
          action: "register",
          workData: {
            title: title,
            status: status,
            seasons: stateSeasons,
            genres: stateGenres,
            studios: studios,
            authors: authors,
            directors: directors,
            charaDesigns: charaDesigns,
            musics: musics
          }
        };

        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === "success") {
          msg.textContent = "✔ Notionに登録完了しました！";
          msg.style.color = "#0a7c42";
        } else {
          msg.textContent = `❌ エラー: ${res.message}`;
          msg.style.color = "red";
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = `❌ 通信エラー: ${err.message}`;
        msg.style.color = "red";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
